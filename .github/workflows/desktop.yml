# Builds the Windows app (installer + portable .exe) on every push.
# Download it from the run's "Artifacts" section on the Actions tab.
# A new version in package.json (or a v* tag) also makes a GitHub Release.
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Blockfire-Windows
          path: dist/*.exe
          if-no-files-found: error
      # Download page (GitHub Release) with the installer, the portable .exe
      # and the one-file web version. Made when a v* tag is pushed, or when
      # the version in package.json doesn't have a release yet.
      - name: Check for a new version
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            tag="v$(node -p "require('./package.json').version")"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.rel.outputs.tag
        shell: bash
        run: cp index.html dist/Blockfire.html
      - if: steps.rel.outputs.tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Blockfire ${{ steps.rel.outputs.tag }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/Blockfire.html
