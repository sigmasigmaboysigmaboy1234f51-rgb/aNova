# Builds the Windows app (installer + portable .exe) on every push.
# Download it from the run's "Artifacts" section on the Actions tab.
# Pushing a tag like v2.0.0 also makes a GitHub Release (download page).
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Blockfire-Windows
          path: dist/*.exe
          if-no-files-found: error
      # A tag like v2.0.0 makes a download page (GitHub Release) with the
      # installer, the portable .exe and the one-file web version.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp index.html dist/Blockfire.html
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Blockfire ${{ github.ref_name }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/Blockfire.html
